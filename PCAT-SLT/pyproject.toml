[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pcat-slt"
version = "0.3.0"
description = "Progress-Coupled Area Transport for landmark-to-text sign language translation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.3,<3", "numpy>=1.26,<3", "PyYAML>=6,<7", "sacrebleu>=2.4,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
multimodal = ["transformers>=4.45,<5", "Pillow>=10,<14", "sentencepiece>=0.2,<1"]

[project.scripts]
pcat-train = "pcat_slt.train:main"
pcat-evaluate = "pcat_slt.evaluate:main"
pcat-predict = "pcat_slt.predict:main"
pcat-demo-data = "pcat_slt.synthetic:main"
pcat-validate = "pcat_slt.validate:main"
pcat-import-corpus = "pcat_slt.corpora:main"
pcat-demo-visual = "pcat_slt.visual_synthetic:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
