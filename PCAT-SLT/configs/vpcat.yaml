model:
  rank: 8
  bins: 64
  progress_scales: [1, 64]
  progress_augmentation: true
  width: 320
  heads: 8
  encoder_layers: 2
  decoder_layers: 4
  max_target_length: 256
  detail_memory: true
  detail_position_dim: 32
  timing: true
  body_frame: dual
  body_time_constant: 0.25
  depth_policy: ignore
  transport: givens
  integration: prefix
  integration_precision: float32
  area_sketch_dim: 16
  area_sketch_heads: 2
  adaptive_step: 2.0
  adaptive_min_bins: 8
  local_clocks: true
  local_bins: 8
  visual_backend: dinov2
  visual_regions: 4
  visual_to_articulator: [0, 1, 2, 2]
  visual_dim: 64
  visual_memory_norm: true
  allow_unanchored_rgb: true
  visual_model: facebook/dinov2-small
  visual_revision: main
  visual_frozen: true
  visual_chunk_size: 32
  text_backend: hf
  text_model: google/flan-t5-base
  text_revision: main
  text_frozen: false
  generation_beams: 4
data:
  train: data/real/train.jsonl
  val: data/real/val.jsonl
  test: data/real/test.jsonl
  batch_size: 2
  max_frames: 400
  max_bytes: 254
train:
  epochs: 40
  lr: 0.00005
  accumulation: 4
  warmup_steps: 100
  device: auto
  output_dir: runs/vpcat_real
