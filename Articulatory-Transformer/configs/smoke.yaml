# Fast Smoke-Test Configuration for AB-ST
data:
  num_landmarks: 66
  raw_landmarks: 543
  in_channels: 3
  max_frames: 32
  target_fps: 25
  image_size: [224, 224]
  patch_size: 14
  vocab_size: 1000
  max_text_len: 32
  dataset_name: "SmokeTest"
  data_dir: "data"
  splits_file: null
  num_workers: 0
  batch_size: 2

pose:
  num_joints: 66
  in_channels: 3
  has_confidence: false
  left_hand_slice: [0, 21]
  right_hand_slice: [21, 42]
  body_slice: [42, 48]
  face_slice: [48, 66]
  left_shoulder_idx: 42
  right_shoulder_idx: 43
  ema_momentum: 0.95
  eps: 1.0e-06
  velocity_window: 3
  energy_threshold: 0.0001
  use_role_embeddings: true

vision:
  backbone_name: "dinov2_vits14"
  image_size: 224
  patch_size: 14
  embed_dim: 384
  pretrained: false
  freeze_backbone: true
  grid_size: [16, 16]

binding:
  visual_dim: 384
  pose_dim: 3
  hidden_dim: 64
  num_heads: 2
  max_offset: 0.15
  dropout: 0.0
  use_deformable_sampling: true

articulator:
  num_articulators: 4
  articulator_names:
    - "dominant_hand"
    - "base_hand"
    - "face"
    - "torso"
  embed_dim: 64
  aggregation_heads: 2
  dropout: 0.0

temporal:
  hidden_dim: 64
  num_spatial_heads: 2
  num_temporal_heads: 2
  num_layers: 2
  ffn_expansion_factor: 2
  conv_kernel_size: 5
  dropout: 0.0
  max_seq_len: 64
  enable_fingerspelling_ctc: true
  ctc_vocab_size: 32

resampler:
  num_queries: 8
  hidden_dim: 128
  num_layers: 2
  num_heads: 4
  dropout: 0.0
  output_dim: 128

decoder:
  model_type: "seq2seq"
  pretrained_model_name: "mock"
  d_model: 128
  max_target_len: 32
  label_smoothing: 0.0
  beam_size: 1
  length_penalty: 1.0

loss:
  translation_weight: 1.0
  ctc_weight: 0.2
  articulatory_alignment_weight: 0.1
  modality_dropout_prob: 0.0
  label_smoothing: 0.0

train:
  learning_rate: 0.001
  min_learning_rate: 1.0e-05
  weight_decay: 0.0001
  warmup_steps: 10
  max_steps: 50
  gradient_accumulation_steps: 1
  gradient_clip_val: 1.0
  mixed_precision: "no"
  seed: 42
  save_dir: "checkpoints/smoke"
  log_interval: 5
  eval_interval: 20
  save_top_k: 1

