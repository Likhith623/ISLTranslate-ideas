# Articulatory-Bound Spatiotemporal Transformer (AB-ST) Base Configuration
data:
  num_landmarks: 66
  raw_landmarks: 543
  in_channels: 3
  max_frames: 256
  target_fps: 25
  image_size: [224, 224]
  patch_size: 14
  vocab_size: 32128
  max_text_len: 128
  dataset_name: "ISLTranslate"
  data_dir: "data"
  splits_file: null
  num_workers: 4
  batch_size: 8

pose:
  num_joints: 66
  in_channels: 3
  has_confidence: false
  left_hand_slice: [0, 21]
  right_hand_slice: [21, 42]
  body_slice: [42, 48]
  face_slice: [48, 66]
  left_shoulder_idx: 42
  right_shoulder_idx: 43
  ema_momentum: 0.95
  eps: 1.0e-06
  velocity_window: 5
  energy_threshold: 0.0001
  use_role_embeddings: true

vision:
  backbone_name: "dinov2_vits14"
  image_size: 224
  patch_size: 14
  embed_dim: 384
  pretrained: true
  freeze_backbone: true
  grid_size: [16, 16]

binding:
  visual_dim: 384
  pose_dim: 3
  hidden_dim: 256
  num_heads: 4
  max_offset: 0.15
  dropout: 0.1
  use_deformable_sampling: true

articulator:
  num_articulators: 4
  articulator_names:
    - "dominant_hand"
    - "base_hand"
    - "face"
    - "torso"
  embed_dim: 256
  aggregation_heads: 4
  dropout: 0.1

temporal:
  hidden_dim: 256
  num_spatial_heads: 4
  num_temporal_heads: 8
  num_layers: 6
  ffn_expansion_factor: 4
  conv_kernel_size: 31
  dropout: 0.1
  max_seq_len: 512
  enable_fingerspelling_ctc: true
  ctc_vocab_size: 64

resampler:
  num_queries: 32
  hidden_dim: 512
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  output_dim: 768

decoder:
  model_type: "seq2seq"
  pretrained_model_name: "google/flan-t5-base"
  d_model: 768
  max_target_len: 128
  label_smoothing: 0.1
  beam_size: 4
  length_penalty: 1.0

loss:
  translation_weight: 1.0
  ctc_weight: 0.2
  articulatory_alignment_weight: 0.1
  modality_dropout_prob: 0.15
  label_smoothing: 0.1

train:
  learning_rate: 0.0001
  min_learning_rate: 1.0e-06
  weight_decay: 0.01
  warmup_steps: 1000
  max_steps: 50000
  gradient_accumulation_steps: 2
  gradient_clip_val: 1.0
  mixed_precision: "fp16"
  seed: 42
  save_dir: "checkpoints"
  log_interval: 50
  eval_interval: 500
  save_top_k: 3

